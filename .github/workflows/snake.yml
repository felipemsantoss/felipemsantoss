name: Generate Snake (minhoca comendo os commits)

on:
  schedule:
    # roda todo dia às 03:00 UTC (~00:00 em Maringá/PR)
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Gera o SVG da minhoca
        uses: Platane/snk@v3
        with:
          github_user_name: felipemsantoss
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publica no branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
